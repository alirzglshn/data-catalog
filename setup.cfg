[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    migrations,
    .venv,
    venv,
    staticfiles
# E203/W503 conflict with black's own formatting choices around
# slices and line breaks before binary operators, black is treated
# as the source of truth for those two cases
extend-ignore = E203, W503
